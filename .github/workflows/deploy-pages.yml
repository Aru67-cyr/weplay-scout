name: Update data and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # GitHub schedules use UTC; 19:00 UTC is 03:00 in Singapore.
    - cron: "0 19 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Singapore
      SCOUTLINE_DB_PATH: .cache/scoutline.db
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      SCOUTLINE_YOUTUBE_CHANNELS: ${{ vars.SCOUTLINE_YOUTUBE_CHANNELS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Restore collection history
        uses: actions/cache@v5
        with:
          path: .cache/scoutline.db
          key: scoutline-db-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            scoutline-db-

      - name: Collect data and build static site
        run: python export_static.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
